name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyclesguard-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cyclesguard-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BFakePublicKeyForCiBuildOnlyReplaceInProd1234567890
          VAPID_PRIVATE_KEY: fake-private-key
          CRON_SECRET: ci-cron-secret
          CONSENT_IP_SALT: ci-consent-salt
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_DEMO_MODE: 'true'

  e2e-public:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: cyclesguard-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cyclesguard-frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:public
        env:
          E2E_BASE_URL: https://cyclesguard.vercel.app

  ingestion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyclesguard-ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
