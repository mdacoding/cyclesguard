server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cyclesguard}
    username: ${DB_USER:cyclesguard}
    password: ${DB_PASS:cyclesguard}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

  security:
    user:
      name: ${MANAGEMENT_USER:cyclesguard-admin}
      password: ${MANAGEMENT_PASSWORD:changeme-in-production}
      roles: MANAGEMENT

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

cyclesguard:
  security:
    management-api-key: ${MANAGEMENT_API_KEY:changeme-management-key}
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:3000}
  webhook:
    secret: ${WEBHOOK_SECRET:changeme-in-production}
  queue:
    capacity: 10000
  cleansing:
    ema-alpha: 0.3
    max-heart-rate: 220
    min-heart-rate: 30
    max-speed-kmh: 40.0
    max-timestamp-gap-seconds: 5
